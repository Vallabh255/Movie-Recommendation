<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PopcornPal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="hero-section">
        
        <div class="logo-container">
            <svg class="popcorn-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
                <circle cx="12" cy="5" r="1"></circle>
                <circle cx="12" cy="19" r="1"></circle>
                <circle cx="5" cy="12" r="1"></circle>
                <circle cx="19" cy="12" r="1"></circle>
                <circle cx="7" cy="7" r="1"></circle>
                <circle cx="17" cy="17" r="1"></circle>
                <circle cx="17" cy="7" r="1"></circle>
                <circle cx="7" cy="17" r="1"></circle>
            </svg>
            <h1 class="main-title">PopcornPal</h1>
        </div>

        <p class="subtitle">Describe a movie, mood, or pick a film you loved</p>

        <div class="search-container">
            <svg class="search-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            
            <input type="text" class="searchInput" placeholder='e.g. "Interstellar" or "mind-bending thriller"' />
            
            <button class="search-text-btn okbtn">Search</button>
        </div>
    </div>
    <div class="results-header">
        <h2 id="resultsTitle">Recommendations</h2>
        <button id="viewAllBtn" class="view-all-btn">View All</button>
    </div>

    <div class="results-wrapper">
        <button id="scrollLeft" class="scroll-arrow">&lt;</button>
        <div id="results" class="results-container horizontal-scroll"></div>
        <button id="scrollRight" class="scroll-arrow">&gt;</button>
    </div>

    <div id="movieOverlay" class="movie-overlay hidden">
        <div class="movie-popup">
            <button class="close-popup">&times;</button>
            <div id="movieDetailContent">Loading...</div>
        </div>
    </div>

    <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(11, 15, 25, 0.85); z-index:9999; align-items:center; justify-content:center;">
        <div class="spinner"></div>
    </div>
</body>
</html>
